<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Setembro</title>
  <link rel="stylesheet" href="style2.css">
  <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="container">
    <!-- Título -->
    <h1 class="titulo">SETEMBRO</h1>

    <div class="conteudo">
      <!-- Calendário -->
      <table class="calendario">
        <thead>
          <tr>
            <th>Domingo</th>
            <th>Segunda-Feira</th>
            <th>Terça-Feira</th>
            <th>Quarta-Feira</th>
            <th>Quinta-Feira</th>
            <th>Sexta-Feira</th>
            <th>Sábado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="cinza">31</td>
            <td data-dia="1"></td>
            <td data-dia="2"></td>
            <td data-dia="3"></td>
            <td data-dia="4"></td>
            <td data-dia="5"></td>
            <td data-dia="6"></td>
          </tr>
          <tr>
            <td data-dia="7"></td>
            <td data-dia="8"></td>
            <td data-dia="9"></td>
            <td data-dia="10"></td>
            <td data-dia="11"></td>
            <td data-dia="12"></td>
            <td data-dia="13"></td>
          </tr>
          <tr>
            <td data-dia="14"></td>
            <td data-dia="15"></td>
            <td data-dia="16"></td>
            <td data-dia="17"></td>
            <td data-dia="18"></td>
            <td data-dia="19"></td>
            <td data-dia="20"></td>
          </tr>
          <tr>
            <td data-dia="21"></td>
            <td data-dia="22"></td>
            <td data-dia="23"></td>
            <td data-dia="24"></td>
            <td data-dia="25"></td>
            <td data-dia="26"></td>
            <td data-dia="27"></td>
          </tr>
          <tr>
            <td data-dia="28"></td>
            <td data-dia="29"></td>
            <td data-dia="30"></td>
            <td class="cinza">1</td>
            <td class="cinza">2</td>
            <td class="cinza">3</td>
            <td class="cinza">4</td>
          </tr>
        </tbody>
      </table>

      <!-- Card do evento -->
      <div class="evento" id="evento-card">
        <h2 id="evento-data">SET.03</h2>
        <img id="evento-imagem" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Twemoji12_1f397.svg/250px-Twemoji12_1f397.svg.png" alt="Laço Amarelo" >
        <p id="evento-titulo"><strong>EVENTO:</strong> Palestra sobre prevenção ao suicídio</p>
        <p id="evento-local"><strong>LOCAL:</strong> Auditório</p>
        <p id="evento-horario"><strong>HORÁRIO:</strong> 9:00 AM</p>
      </div>
    </div>
  </div>
  <script>
    const eventos = {
  3: {
    data: "SET.03",
    titulo: "Palestra sobre prevenção ao suicídio",
    local: "Auditório",
    horario: "9:00 AM",
    imagem: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Twemoji12_1f397.svg/250px-Twemoji12_1f397.svg.png"
  },
  7: {
    data: "SET.07",
    titulo: "Desfile da Independência",
    local: "Praça Central",
    horario: "8:00 AM",
    imagem: "https://cdn-icons-png.flaticon.com/512/197/197386.png" // bandeira Brasil
  },
  15: {
    data: "SET.15",
    titulo: "Reunião de Pais e Mestres",
    local: "Sala 12",
    horario: "14:00 PM",
    imagem: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
  },
  22: {
    data: "SET.22",
    titulo: "Campanha de Doação de Sangue",
    local: "Ginásio",
    horario: "10:00 AM",
    imagem: "https://cdn-icons-png.flaticon.com/512/1904/1904425.png"
  }
};

// Seleciona elementos do card
const eventoData = document.getElementById("evento-data");
const eventoTitulo = document.getElementById("evento-titulo");
const eventoLocal = document.getElementById("evento-local");
const eventoHorario = document.getElementById("evento-horario");
const eventoImagem = document.getElementById("evento-imagem");

// Adiciona cliques nos dias do calendário
document.querySelectorAll("td[data-dia]").forEach(td => {
  td.textContent = td.dataset.dia; // Mostrar número do dia

  td.addEventListener("click", () => {
    const dia = td.dataset.dia;

    if (eventos[dia]) {
      // Atualiza card com informações do evento
      eventoData.textContent = eventos[dia].data;
      eventoTitulo.innerHTML = `<strong>EVENTO:</strong> ${eventos[dia].titulo}`;
      eventoLocal.innerHTML = `<strong>LOCAL:</strong> ${eventos[dia].local}`;
      eventoHorario.innerHTML = `<strong>HORÁRIO:</strong> ${eventos[dia].horario}`;
      eventoImagem.src = eventos[dia].imagem;
    } else {
      // Sem evento
      eventoData.textContent = `SET.${dia.padStart(2, "0")}`;
      eventoTitulo.innerHTML = `<strong>EVENTO:</strong> Nenhum evento neste dia`;
      eventoLocal.innerHTML = `<strong>LOCAL:</strong> -`;
      eventoHorario.innerHTML = `<strong>HORÁRIO:</strong> -`;
      eventoImagem.src = "https://cdn-icons-png.flaticon.com/512/565/565547.png"; // ícone vazio
    }
  });
});
Object.keys(eventos).forEach(dia => {
  const celula = document.querySelector(`td[data-dia="${dia}"]`);
  if (celula) {
    celula.classList.add("evento-dia");
  }
});
  </script>
  <footer>
    <a href="index.html"><img src="imagens/home_azul (2).png" alt="home" class="home"></a>
  </footer>
</body>
</html>
